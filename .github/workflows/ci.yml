name: C++ CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Instalar Python (necessário pro Conan)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar Conan
        run: |
          pip install conan
          conan profile detect --force

      - name: Instalar dependências (Conan)
        run: |
          cd competitive_programming
          conan install . \
            --output-folder=../build \
            --build=missing

      - name: Configurar CMake
        run: |
          cmake -B build -S competitive_programming \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Rodar testes
        run: |
          cd build
          ctest --output-on-failure